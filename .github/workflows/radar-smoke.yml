name: radar-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  grants-gov-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run live Grants.gov radar
        run: npm run radar:grants > radar-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-grants-live
          path: radar-output.json
          if-no-files-found: warn
